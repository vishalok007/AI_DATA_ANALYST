name: Keep Streamlit App Alive 24/7

on:
  schedule:
    # Runs every 6 hours to prevent Streamlit Cloud inactivity sleep
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Streamlit App
        run: |
          curl -s -L "https://3cibvktrrltbwhrdg39ieh.streamlit.app" > /dev/null
          echo "Ping sent successfully at $(date)"
